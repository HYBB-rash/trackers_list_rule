name: Build tracker rules

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tracker-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-cache-dir requests PyYAML

      - name: Prepare output directory
        run: mkdir -p dist

      - name: Generate rule file
        run: python src/main.py

      - name: Commit & push if changed
        run: |
          git add -- dist/trackers_list_rule.yaml
          if git diff --cached --quiet; then
            echo "No tracker rule changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "auto: update tracker rules"
          git push
